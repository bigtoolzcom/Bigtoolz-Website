<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<title>News Editor - BigToolz Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f8f9fc;color:#1a1a2e;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}

  /* HEADER */
  .admin-header{background:#fff;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;padding-top:env(safe-area-inset-top,0);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:1px solid #e5e7eb}
  .admin-logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#1a1a2e;text-decoration:none;letter-spacing:-.5px}
  .admin-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#10b981,#059669);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(16,185,129,.3)}
  .admin-logo span{color:#059669}
  .admin-header-right{display:flex;align-items:center;gap:10px}
  .admin-btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s;border:none;min-height:44px}
  .btn-outline{background:#fff;color:#4b5563;border:1px solid #e5e7eb}
  .btn-outline:hover{border-color:#059669;color:#059669;background:#ecfdf5}
  .btn-success{background:#10b981;color:#fff}
  .btn-success:hover{background:#059669}
  .btn-success:disabled{opacity:.6;cursor:not-allowed}

  /* MAIN */
  .editor-main{max-width:1400px;margin:0 auto;padding:32px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
  .editor-left{min-width:0}
  .editor-right{position:sticky;top:88px}
  .card{background:#fff;border-radius:14px;padding:24px;border:1px solid #e5e7eb;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card-title{font-size:16px;font-weight:800;color:#0a0e27;margin-bottom:16px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}

  /* FORM */
  .form-group{margin-bottom:18px}
  .form-group:last-child{margin-bottom:0}
  .form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  .form-group label .req{color:#ef4444}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;color:#1a1a2e;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}
  .form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
  .form-hint{font-size:11px;color:#9ca3af;margin-top:4px}

  /* EDITOR */
  .editor-toolbar{display:flex;gap:4px;padding:8px;background:#f8fafc;border:1px solid #e5e7eb;border-bottom:none;border-radius:10px 10px 0 0;flex-wrap:wrap}
  .editor-toolbar button{padding:7px 11px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#4b5563;transition:all .2s;min-width:34px;min-height:34px}
  .editor-toolbar button:hover{background:#10b981;color:#fff;border-color:#10b981}
  .editor-toolbar .divider{width:1px;background:#e5e7eb;margin:0 4px}

  .editor-content{width:100%;min-height:500px;padding:20px;border:1px solid #e5e7eb;border-radius:0 0 10px 10px;font-size:15px;font-family:inherit;color:#1a1a2e;outline:none;line-height:1.75;overflow-y:auto;background:#fff}
  .editor-content:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
  .editor-content:empty::before{content:attr(data-placeholder);color:#9ca3af;pointer-events:none}
  .editor-content h1{font-size:26px;font-weight:800;margin:16px 0 12px}
  .editor-content h2{font-size:22px;font-weight:700;margin:20px 0 12px}
  .editor-content h3{font-size:18px;font-weight:700;margin:16px 0 10px}
  .editor-content p{margin-bottom:12px}
  .editor-content ul,.editor-content ol{margin:12px 0 12px 24px}
  .editor-content li{margin-bottom:6px}
  .editor-content blockquote{border-left:4px solid #10b981;padding:12px 16px;background:#f0fdf4;border-radius:0 8px 8px 0;margin:14px 0;font-style:italic;color:#4b5563}
  .editor-content code{background:#f3f4f6;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px}
  .editor-content pre{background:#1a1a2e;color:#e2e8f0;padding:16px;border-radius:8px;overflow-x:auto;margin:14px 0;font-family:monospace;font-size:13px}
  .editor-content a{color:#2563eb;text-decoration:underline}
  .editor-content img{max-width:100%;border-radius:8px;margin:12px 0}

  /* IMAGE */
  .image-preview{width:100%;height:180px;background:#f8fafc;border:2px dashed #e5e7eb;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden;position:relative}
  .image-preview img{width:100%;height:100%;object-fit:cover}
  .image-preview-empty{color:#9ca3af;font-size:13px;text-align:center;padding:20px}
  .image-actions{display:flex;gap:8px;flex-wrap:wrap}
  .image-actions button{flex:1;padding:11px 14px;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;border:1px solid #e5e7eb;background:#fff;color:#4b5563;transition:all .2s;min-height:44px}
  .image-actions button:hover{border-color:#10b981;color:#059669;background:#f0fdf4}
  .file-input{display:none}

  /* TAGS */
  .tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-height:46px;align-items:center}
  .tags-input-wrap:focus-within{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}
  .tag-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;background:#d1fae5;color:#065f46;border-radius:14px;font-size:12px;font-weight:600}
  .tag-chip button{background:none;border:none;color:#065f46;cursor:pointer;font-size:14px;line-height:1;padding:0}
  .tags-input-wrap input{flex:1;min-width:80px;border:none;outline:none;font-size:13px;font-family:inherit;padding:4px 0;background:transparent}

  /* STATUS */
  .status-pills{display:flex;gap:8px}
  .status-pill{flex:1;padding:11px;border:2px solid #e5e7eb;border-radius:10px;background:#fff;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#6b7280;transition:all .2s;font-family:inherit;min-height:44px}
  .status-pill.active{border-color:#10b981;background:#ecfdf5;color:#059669}
  .status-pill:hover:not(.active){border-color:#6ee7b7}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .modal-overlay.visible{display:flex}
  .modal-content{background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;padding:32px}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .modal-title{font-size:20px;font-weight:800}
  .modal-close{width:36px;height:36px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;font-size:16px;color:#4b5563}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:#0a0e27;color:#fff;padding:14px 22px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:3000;transform:translateY(200%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:340px;backdrop-filter:blur(10px)}
  .toast.visible{transform:translateY(0)}
  .toast.success{background:#10b981}
  .toast.error{background:#ef4444}

  /* MOBILE */
  @media(max-width:1024px){
    .editor-main{grid-template-columns:1fr;padding:20px}
    .editor-right{position:static}
  }
  @media(max-width:768px){
    .admin-header{padding:0 16px;height:auto;min-height:64px;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
    .admin-logo{font-size:16px}
    .admin-header-right{flex-wrap:wrap;gap:6px;width:100%}
    .admin-btn{flex:1;justify-content:center;padding:9px 10px;font-size:12px}
    .editor-main{padding:16px;gap:14px}
    .card{padding:16px;margin-bottom:14px}
    .card-title{font-size:14px;margin-bottom:12px}
    .editor-toolbar{overflow-x:auto;flex-wrap:nowrap;padding:6px}
    .editor-toolbar button{flex-shrink:0;padding:6px 9px;font-size:11px}
    .editor-content{min-height:340px;font-size:14px;padding:14px}
    .image-preview{height:150px}
    .image-actions button{padding:10px;font-size:11px}
  }
  @media(max-width:480px){
    .editor-main{padding:12px}
    .card{padding:14px}
    .admin-btn{padding:8px 10px;font-size:11px;gap:4px}
  }

  /* DARK */
  html[data-theme="dark"] body{background:#0f172a;color:#f1f5f9}
  html[data-theme="dark"] .admin-header{background:#1e293b;border-color:#334155}
  html[data-theme="dark"] .admin-logo{color:#f1f5f9}
  html[data-theme="dark"] .btn-outline{background:#1e293b;border-color:#334155;color:#cbd5e1}
  html[data-theme="dark"] .card{background:#1e293b;border-color:#334155}
  html[data-theme="dark"] .card-title{color:#f1f5f9}
  html[data-theme="dark"] .form-group label{color:#cbd5e1}
  html[data-theme="dark"] .form-group input,
  html[data-theme="dark"] .form-group select,
  html[data-theme="dark"] .form-group textarea{background:#0f172a;border-color:#334155;color:#f1f5f9}
  html[data-theme="dark"] .editor-toolbar{background:#0f172a;border-color:#334155}
  html[data-theme="dark"] .editor-toolbar button{background:#1e293b;border-color:#334155;color:#cbd5e1}
  html[data-theme="dark"] .editor-content{background:#0f172a;border-color:#334155;color:#f1f5f9}
  html[data-theme="dark"] .image-preview{background:#0f172a;border-color:#334155}
  html[data-theme="dark"] .image-actions button{background:#1e293b;border-color:#334155;color:#cbd5e1}
  html[data-theme="dark"] .tags-input-wrap{background:#0f172a;border-color:#334155}
  html[data-theme="dark"] .tag-chip{background:#064e3b;color:#6ee7b7}
  html[data-theme="dark"] .status-pill{background:#1e293b;border-color:#334155;color:#94a3b8}
  html[data-theme="dark"] .status-pill.active{background:#064e3b;border-color:#10b981;color:#6ee7b7}
  html[data-theme="dark"] .modal-content{background:#1e293b;color:#f1f5f9}
  html[data-theme="dark"] .modal-close{background:#0f172a;color:#cbd5e1}
</style>
</head>
<body>

<header class="admin-header">
  <a href="/admin/" class="admin-logo">
    <div class="admin-logo-icon">📰</div>
    News Editor
  </a>
  <div class="admin-header-right">
    <button class="admin-btn btn-outline" id="previewBtn">👁 Preview</button>
    <button class="admin-btn btn-outline" id="draftBtn">💾 Draft</button>
    <button class="admin-btn btn-success" id="publishBtn">🚀 Publish</button>
    <a href="/admin/" class="admin-btn btn-outline">← Back</a>
  </div>
</header>

<main class="editor-main">

  <div class="editor-left">

    <div class="card">
      <div class="form-group">
        <label for="newsTitle">News Title <span class="req">*</span></label>
        <input type="text" id="newsTitle" placeholder="Enter news headline..." style="font-size:18px;font-weight:700;padding:14px 16px;">
      </div>
      <div class="form-group">
        <label for="newsSlug">URL Slug</label>
        <input type="text" id="newsSlug" placeholder="auto-generated-from-title">
        <div class="form-hint">Only lowercase letters, numbers, and hyphens.</div>
      </div>
    </div>

    <div class="card" style="padding:0;">
      <div class="editor-toolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" title="Strike">S̶</button>
        <div class="divider"></div>
        <button type="button" data-block="h2" title="Heading 2">H2</button>
        <button type="button" data-block="h3" title="Heading 3">H3</button>
        <button type="button" data-block="p" title="Paragraph">¶</button>
        <div class="divider"></div>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        <button type="button" data-block="blockquote" title="Quote">❝</button>
        <div class="divider"></div>
        <button type="button" id="linkBtn" title="Insert link">🔗</button>
        <button type="button" id="imageBtn" title="Insert image">🖼</button>
        <button type="button" id="codeBtn" title="Code block">&lt;/&gt;</button>
        <div class="divider"></div>
        <button type="button" data-cmd="removeFormat" title="Clear formatting">✕</button>
      </div>
      <div id="newsContent" class="editor-content" contenteditable="true" data-placeholder="Write your news content here..."></div>
    </div>

  </div>

  <div class="editor-right">

    <div class="card">
      <div class="card-title">📌 Publish Status</div>
      <div class="status-pills">
        <button class="status-pill active" data-status="draft">📝 Draft</button>
        <button class="status-pill" data-status="published">✅ Published</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">✍️ Author</div>
      <div class="form-group">
        <label for="authorName">Author Name</label>
        <input type="text" id="authorName" placeholder="e.g., BigToolz Team" value="BigToolz Team">
        <div class="form-hint">Ye naam news article par dikhega (public).</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🖼 Featured Image</div>
      <div class="image-preview" id="imagePreview">
        <div class="image-preview-empty">No image selected</div>
      </div>
      <input type="file" id="imageFile" class="file-input" accept="image/*">
      <input type="text" id="imageUrl" placeholder="Or paste image URL..." style="width:100%;padding:11px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:13px;margin-bottom:10px;font-family:inherit;outline:none;">
      <div class="image-actions">
        <button type="button" id="uploadImageBtn">📁 Upload</button>
        <button type="button" id="clearImageBtn">🗑 Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📁 Category</div>
      <div class="form-group">
        <select id="newsCategory">
          <option value="General">General</option>
          <option value="Breaking News">Breaking News</option>
          <option value="Technology">Technology</option>
          <option value="AI">AI</option>
          <option value="Business">Business</option>
          <option value="Sports">Sports</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Politics">Politics</option>
          <option value="World">World</option>
          <option value="India">India</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔗 Source</div>
      <div class="form-group">
        <label for="newsSource">Source Name</label>
        <input type="text" id="newsSource" placeholder="e.g., BBC, Reuters, PTI">
      </div>
      <div class="form-group">
        <label for="newsSourceUrl">Source URL</label>
        <input type="url" id="newsSourceUrl" placeholder="https://...">
      </div>
    </div>

    <div class="card">
      <div class="card-title">🏷 Tags</div>
      <div class="tags-input-wrap" id="tagsWrap">
        <input type="text" id="tagInput" placeholder="Type and press Enter...">
      </div>
      <div class="form-hint" style="margin-top:8px;">Press Enter to add tag.</div>
    </div>

    <div class="card">
      <div class="card-title">🔍 SEO Settings</div>
      <div class="form-group">
        <label for="metaTitle">Meta Title</label>
        <input type="text" id="metaTitle" placeholder="SEO title (50-60 chars)">
        <div class="form-hint"><span id="metaTitleCount">0</span> / 60</div>
      </div>
      <div class="form-group">
        <label for="metaDesc">Meta Description</label>
        <textarea id="metaDesc" placeholder="SEO description (150-160 chars)" style="min-height:70px;"></textarea>
        <div class="form-hint"><span id="metaDescCount">0</span> / 160</div>
      </div>
      <div class="form-group">
        <label for="newsExcerpt">Excerpt</label>
        <textarea id="newsExcerpt" placeholder="Short summary for listing page..." style="min-height:80px;"></textarea>
        <div class="form-hint">Leave empty to auto-generate.</div>
      </div>
    </div>

  </div>

</main>

<div class="modal-overlay" id="previewModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Preview</div>
      <button class="modal-close" id="closePreview">✕</button>
    </div>
    <div id="previewContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const SUPABASE_URL = 'https://btmeygsirnyuzsubscde.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rncmFbKPlBLxkeIEXaFxfQ_rIbjebnJ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;if(t==='dark'||(!t&&d))document.documentElement.setAttribute('data-theme','dark');else if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

function showToast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 3000;
  const t = $('#toast');
  if (!t) return;
  t.className = 'toast visible' + (type !== 'info' ? ' ' + type : '');
  t.textContent = msg;
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('visible'); }, duration);
}

function generateSlug(text) {
  if (!text) return '';
  return String(text).toLowerCase().trim()
    .replace(/[^\w\s-]/g, '')
    .replace(/[\s_]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 80);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function getFileExtension(file) {
  const parts = (file.name || '').split('.');
  let ext = '';
  if (parts.length > 1) ext = parts.pop().toLowerCase();
  const VALID = ['jpg','jpeg','png','webp','gif','svg','bmp','avif'];
  if (ext && VALID.indexOf(ext) !== -1) {
    if (ext === 'jpeg') ext = 'jpg';
    return ext;
  }
  const mime = (file.type || '').toLowerCase();
  if (mime.indexOf('png') !== -1) return 'png';
  if (mime.indexOf('webp') !== -1) return 'webp';
  if (mime.indexOf('gif') !== -1) return 'gif';
  if (mime.indexOf('svg') !== -1) return 'svg';
  return 'jpg';
}

function buildFileName(file) {
  const ext = getFileExtension(file);
  let base = (file.name || 'news').replace(/\.[^.]+$/, '');
  base = generateSlug(base) || 'news';
  return Date.now() + '-' + base + '.' + ext;
}

let currentUser = null;
let editingNewsId = null;
let tags = [];
let featuredImageUrl = '';
let currentStatus = 'draft';

(async function init() {
  try {
    const sessionResult = await sb.auth.getSession();
    const session = sessionResult.data && sessionResult.data.session;

    if (!session) {
      window.location.href = '/admin/login.html';
      return;
    }
    currentUser = session.user;

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    if (editId) {
      editingNewsId = editId;
      await loadNews(editId);
    }

    setupEditor();
    setupToolbar();
    setupTags();
    setupImage();
    setupStatusPills();
    setupSEOCounters();
    setupButtons();

    if (!editingNewsId) restoreDraft();

  } catch (err) {
    console.error('Init error:', err);
    showToast('Init failed: ' + err.message, 'error');
  }
})();

async function loadNews(id) {
  try {
    const result = await sb.from('news').select('*').eq('id', id).single();
    if (result.error) throw result.error;
    const data = result.data;

    $('#newsTitle').value = data.title || '';
    $('#newsSlug').value = data.slug || '';
    $('#newsSlug').dataset.manual = 'true';
    $('#newsContent').innerHTML = data.content || '';
    $('#newsCategory').value = data.category || 'General';
    $('#newsSource').value = data.source || '';
    $('#newsSourceUrl').value = data.source_url || '';
    $('#metaTitle').value = data.meta_title || '';
    $('#metaDesc').value = data.meta_description || '';
    $('#newsExcerpt').value = data.excerpt || '';

    if ($('#authorName')) {
      $('#authorName').value = data.author || 'BigToolz Team';
    }

    tags = Array.isArray(data.tags) ? data.tags : [];
    renderTags();

    featuredImageUrl = data.featured_image || '';
    $('#imageUrl').value = featuredImageUrl;
    updateImagePreview();

    currentStatus = data.status || 'draft';
    updateStatusPills();

    $('#metaTitleCount').textContent = ($('#metaTitle').value || '').length;
    $('#metaDescCount').textContent = ($('#metaDesc').value || '').length;

    showToast('News loaded', 'success');
  } catch (err) {
    showToast('Load failed: ' + err.message, 'error');
  }
}

function setupEditor() {
  $('#newsTitle').addEventListener('input', function() {
    if (!$('#newsSlug').dataset.manual) {
      $('#newsSlug').value = generateSlug($('#newsTitle').value);
    }
    saveDraftDebounced();
  });

  $('#newsSlug').addEventListener('input', function() {
    $('#newsSlug').dataset.manual = 'true';
    $('#newsSlug').value = generateSlug($('#newsSlug').value);
  });

  $('#newsContent').addEventListener('input', saveDraftDebounced);
}

function setupToolbar() {
  $$('.editor-toolbar [data-cmd]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      document.execCommand(btn.dataset.cmd, false, null);
      $('#newsContent').focus();
    });
  });

  $$('.editor-toolbar [data-block]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      document.execCommand('formatBlock', false, btn.dataset.block);
      $('#newsContent').focus();
    });
  });

  $('#linkBtn').addEventListener('click', function() {
    var url = prompt('Enter URL:', 'https://');
    if (url) document.execCommand('createLink', false, url);
  });

  $('#imageBtn').addEventListener('click', function() {
    var url = prompt('Enter image URL:', 'https://');
    if (url) document.execCommand('insertImage', false, url);
  });

  $('#codeBtn').addEventListener('click', function() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var text = sel.toString();
    var html = '<pre><code>' + escapeHtml(text || 'your code here') + '</code></pre>';
    document.execCommand('insertHTML', false, html);
  });
}

function setupTags() {
  var input = $('#tagInput');
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var tag = input.value.trim();
      if (tag && tags.indexOf(tag) === -1) {
        tags.push(tag);
        input.value = '';
        renderTags();
      }
    } else if (e.key === 'Backspace' && !input.value && tags.length) {
      tags.pop();
      renderTags();
    }
  });
}

function renderTags() {
  var wrap = $('#tagsWrap');
  $$('.tag-chip', wrap).forEach(function(c) { c.remove(); });
  var input = $('#tagInput');
  tags.forEach(function(tag, i) {
    var chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = escapeHtml(tag) + ' <button type="button" data-i="' + i + '">×</button>';
    chip.querySelector('button').addEventListener('click', function() {
      tags.splice(i, 1);
      renderTags();
    });
    wrap.insertBefore(chip, input);
  });
}

function setupImage() {
  $('#uploadImageBtn').addEventListener('click', function() {
    $('#imageFile').click();
  });

  $('#imageFile').addEventListener('change', async function(e) {
    var file = e.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      showToast('Image too large (max 5MB)', 'error');
      return;
    }

    if (file.type && file.type.indexOf('image/') !== 0) {
      showToast('Please select an image file', 'error');
      return;
    }

    showToast('Uploading image...', 'info');

    try {
      var fileName = buildFileName(file);
      console.log('📤 Uploading:', fileName);

      var uploadResult = await sb.storage
        .from('blog-images')
        .upload(fileName, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type || 'image/jpeg'
        });

      if (uploadResult.error) throw uploadResult.error;

      var urlResult = sb.storage.from('blog-images').getPublicUrl(fileName);
      var publicUrl = urlResult.data.publicUrl;

      featuredImageUrl = publicUrl;
      $('#imageUrl').value = publicUrl;

      updateImagePreview();
      showToast('✅ Image uploaded!', 'success');
      console.log('📸 URL:', publicUrl);
    } catch (err) {
      showToast('Upload failed: ' + err.message, 'error');
      console.error('Upload error:', err);
    }
  });

  $('#imageUrl').addEventListener('input', function(e) {
    var val = e.target.value.trim();
    if (val && (val.indexOf('http://') === 0 || val.indexOf('https://') === 0)) {
      featuredImageUrl = val;
    } else if (!val) {
      featuredImageUrl = '';
    }
    updateImagePreview();
  });

  $('#clearImageBtn').addEventListener('click', function() {
    featuredImageUrl = '';
    $('#imageUrl').value = '';
    updateImagePreview();
  });
}

function updateImagePreview() {
  var preview = $('#imagePreview');
  if (!featuredImageUrl) {
    preview.innerHTML = '<div class="image-preview-empty">No image selected</div>';
    return;
  }
  preview.innerHTML = '<div class="image-preview-empty">Loading...</div>';

  var img = new Image();
  img.onload = function() {
    preview.innerHTML = '';
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.alt = 'Featured';
    preview.appendChild(img);
  };
  img.onerror = function() {
    preview.innerHTML = '<div class="image-preview-empty" style="color:#ef4444;">⚠️ Image failed to load</div>';
  };
  img.src = featuredImageUrl;
}

function setupStatusPills() {
  $$('.status-pill').forEach(function(pill) {
    pill.addEventListener('click', function() {
      currentStatus = pill.dataset.status;
      updateStatusPills();
    });
  });
}

function updateStatusPills() {
  $$('.status-pill').forEach(function(p) {
    p.classList.toggle('active', p.dataset.status === currentStatus);
  });
}

function setupSEOCounters() {
  $('#metaTitle').addEventListener('input', function(e) {
    $('#metaTitleCount').textContent = e.target.value.length;
  });
  $('#metaDesc').addEventListener('input', function(e) {
    $('#metaDescCount').textContent = e.target.value.length;
  });
}

function setupButtons() {
  $('#previewBtn').addEventListener('click', showPreview);
  $('#closePreview').addEventListener('click', function() {
    $('#previewModal').classList.remove('visible');
  });
  $('#previewModal').addEventListener('click', function(e) {
    if (e.target.id === 'previewModal') {
      $('#previewModal').classList.remove('visible');
    }
  });

  $('#draftBtn').addEventListener('click', function() { saveNews('draft'); });
  $('#publishBtn').addEventListener('click', function() { saveNews('published'); });
}

function showPreview() {
  var title = $('#newsTitle').value;
  var content = $('#newsContent').innerHTML;
  var author = ($('#authorName') && $('#authorName').value) || 'BigToolz Team';
  $('#previewContent').innerHTML =
    '<h1 style="font-size:28px;font-weight:800;margin-bottom:8px;">' + escapeHtml(title || 'Untitled') + '</h1>' +
    '<p style="font-size:13px;color:#6b7280;margin-bottom:16px;">By ' + escapeHtml(author) + '</p>' +
    '<div style="font-size:15px;line-height:1.8;color:#4b5563;">' + (content || '<em>No content yet...</em>') + '</div>';
  $('#previewModal').classList.add('visible');
}

var draftTimer;
function saveDraftDebounced() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 2000);
}

function saveDraft() {
  if (editingNewsId) return;
  try {
    var draft = {
      title: $('#newsTitle').value,
      slug: $('#newsSlug').value,
      content: $('#newsContent').innerHTML,
      category: $('#newsCategory').value,
      source: $('#newsSource').value,
      sourceUrl: $('#newsSourceUrl').value,
      excerpt: $('#newsExcerpt').value,
      metaTitle: $('#metaTitle').value,
      metaDesc: $('#metaDesc').value,
      author: ($('#authorName') && $('#authorName').value) || 'BigToolz Team',
      tags: tags,
      featuredImageUrl: featuredImageUrl,
      status: currentStatus,
      savedAt: Date.now()
    };
    localStorage.setItem('bigtoolz_news_draft', JSON.stringify(draft));
  } catch (e) {}
}

function restoreDraft() {
  try {
    var saved = localStorage.getItem('bigtoolz_news_draft');
    if (!saved) return;
    var draft = JSON.parse(saved);
    if (!draft || !draft.savedAt) return;

    if (Date.now() - draft.savedAt > 7 * 24 * 60 * 60 * 1000) {
      localStorage.removeItem('bigtoolz_news_draft');
      return;
    }

    if (editingNewsId) return;

    if (confirm('📝 You have an unsaved draft. Restore it?')) {
      $('#newsTitle').value = draft.title || '';
      $('#newsSlug').value = draft.slug || '';
      $('#newsContent').innerHTML = draft.content || '';
      $('#newsCategory').value = draft.category || 'General';
      $('#newsSource').value = draft.source || '';
      $('#newsSourceUrl').value = draft.sourceUrl || '';
      $('#newsExcerpt').value = draft.excerpt || '';
      $('#metaTitle').value = draft.metaTitle || '';
      $('#metaDesc').value = draft.metaDesc || '';

      if ($('#authorName')) {
        $('#authorName').value = draft.author || 'BigToolz Team';
      }

      tags = Array.isArray(draft.tags) ? draft.tags : [];
      renderTags();

      featuredImageUrl = draft.featuredImageUrl || '';
      $('#imageUrl').value = featuredImageUrl;
      updateImagePreview();

      currentStatus = draft.status || 'draft';
      updateStatusPills();

      showToast('✅ Draft restored', 'success');
    }
  } catch (e) {}
}

async function saveNews(status) {
  var title = $('#newsTitle').value.trim();
  var content = $('#newsContent').innerHTML.trim();
  var slug = $('#newsSlug').value.trim();

  if (!title) {
    showToast('Please enter a title', 'error');
    return;
  }
  if (!content || content === '<br>' || content === '<br/>') {
    showToast('Please write some content', 'error');
    return;
  }

  if (!slug) slug = generateSlug(title);
  if (!slug) {
    showToast('Invalid slug', 'error');
    return;
  }

  var excerpt = $('#newsExcerpt').value.trim() ||
    content.replace(/<[^>]+>/g, '').slice(0, 160).trim() + '...';

  var inputUrl = $('#imageUrl').value.trim();
  var finalImageUrl = inputUrl || featuredImageUrl || null;

  var authorName = ($('#authorName') && $('#authorName').value.trim()) || 'BigToolz Team';

  var payload = {
    title: title,
    slug: slug,
    content: content,
    excerpt: excerpt,
    featured_image: finalImageUrl,
    category: $('#newsCategory').value,
    tags: tags,
    status: status,
    author: authorName,
    source: $('#newsSource').value.trim() || null,
    source_url: $('#newsSourceUrl').value.trim() || null,
    meta_title: $('#metaTitle').value.trim() || title,
    meta_description: $('#metaDesc').value.trim() || excerpt,
    published_at: status === 'published' ? new Date().toISOString() : null
  };

  console.log('📸 Save debug:');
  console.log('  - Author:', authorName);
  console.log('  - Source:', payload.source);
  console.log('  - Status:', status);

  var btn = status === 'published' ? $('#publishBtn') : $('#draftBtn');
  var originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = status === 'published' ? '⏳ Publishing...' : '⏳ Saving...';

  try {
    var result;
    if (editingNewsId) {
      result = await sb.from('news').update(payload).eq('id', editingNewsId).select().single();
    } else {
      result = await sb.from('news').insert([payload]).select().single();
      if (!result.error && result.data) {
        editingNewsId = result.data.id;
      }
    }

    if (result.error) throw result.error;

    localStorage.removeItem('bigtoolz_news_draft');

    showToast(status === 'published' ? '✅ Published to /news/!' : '💾 Draft saved!', 'success');

    if (status === 'published') {
      setTimeout(function() { window.location.href = '/admin/'; }, 1200);
    }
  } catch (err) {
    showToast('Save failed: ' + err.message, 'error');
    console.error('Save error:', err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveNews('draft');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    saveNews('published');
  }
});
</script>
