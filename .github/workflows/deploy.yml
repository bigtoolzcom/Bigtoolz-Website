# ===========================================
# BigToolz - Auto Deploy Workflow
# ===========================================
# Deploys to Netlify (primary), Vercel, and/or GitHub Pages
#
# Setup:
#   Netlify: Add secrets NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#   Vercel:  Add secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   GitHub Pages: Settings → Pages → Source: GitHub Actions
# ===========================================

name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'netlify'
        type: choice
        options:
          - netlify
          - vercel
          - github-pages
          - both

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FORCE_COLOR: '1'

jobs:

  # ===========================================
  # JOB 1: BUILD & VERIFY
  # ===========================================
  build:
    name: 🔨 Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json — static site"
          fi

      - name: 🔍 Verify core HTML files
        run: |
          for file in index.html about.html contact.html privacy-policy.html terms.html disclaimer.html 404.html; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✓ $file"
          done
          echo "✅ All core HTML files present"

      - name: 🔍 Verify critical assets
        run: |
          for dir in assets/css assets/js data; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing: $dir"
              exit 1
            fi
            echo "✓ $dir"
          done

      - name: 📊 Count tool pages
        run: |
          TOOL_COUNT=$(find tools -name "*.html" -type f 2>/dev/null | wc -l)
          echo "📄 Tool pages: $TOOL_COUNT"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .
          retention-days: 7
          if-no-files-found: warn

  # ===========================================
  # JOB 2: DEPLOY TO NETLIFY (PRIMARY)
  # ===========================================
  deploy-netlify:
    name: 🚀 Deploy to Netlify
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'netlify' || github.event.inputs.target == 'both'))

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🚀 Install Netlify CLI
        run: npm install -g netlify-cli

      - name: 🚀 Deploy to Netlify
        run: |
          netlify deploy \
            --prod \
            --dir=. \
            --site=${{ secrets.NETLIFY_SITE_ID }} \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }}
          echo "✅ Deployed to Netlify"

  # ===========================================
  # JOB 3: DEPLOY TO VERCEL
  # ===========================================
  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'vercel' || github.event.inputs.target == 'both'))

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🚀 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "✅ Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ===========================================
  # JOB 4: DEPLOY TO GITHUB PAGES
  # ===========================================
  deploy-github-pages:
    name: 🌐 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'github-pages' || github.event.inputs.target == 'both'))

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
