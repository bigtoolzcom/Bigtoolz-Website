name: Auto Generate Sitemap

on:
  # Har 6 hours mein auto-run
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger
  workflow_dispatch:

  # Push par bhi run karo (optional)
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BigToolz Sitemap Bot"
          git add sitemap.xml
          git commit -m "🗺️ Auto-update sitemap [skip ci]"
          git push

      - name: Summary
        run: |
          echo "### 🗺️ Sitemap Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Changed:** ${{ steps.check.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URLs:** $(grep -c '<url>' sitemap.xml)" >> $GITHUB_STEP_SUMMARY