name: Auto Update Sitemaps

on:
  # Run daily at 2 AM IST (8:30 PM UTC)
  schedule:
    - cron: '30 20 * * *'

  # Run manually from GitHub Actions tab
  workflow_dispatch:

  # Run when blog database or tools database changes
  push:
    paths:
      - 'data/tools-database.js'
      - 'scripts/generate-sitemap.js'
      - '.github/workflows/sitemap.yml'

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sitemap generator
        run: node scripts/generate-sitemap.js

      - name: Check for changes
        id: verify
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "BigToolz Bot"
          git config user.email "bot@bigtoolz.com"
          git add sitemap.xml sitemap-blog.xml sitemap-index.xml
          git commit -m "🤖 Auto-update sitemaps [skip ci]" || echo "No changes"
          git push

      - name: Trigger Netlify Deploy (Build Hook)
        if: steps.verify.outputs.changed == 'true'
        run: |
          echo "🚀 Triggering Netlify deploy..."
          curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}" \
            -w "\n✅ HTTP Status: %{http_code}\n" \
            --fail-with-body
          echo "✅ Netlify deploy triggered"

      - name: Ping Google Search Console
        if: steps.verify.outputs.changed == 'true'
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://bigtoolz.com/sitemap.xml" || true
          curl -s "https://www.google.com/ping?sitemap=https://bigtoolz.com/sitemap-blog.xml" || true
          echo "✅ Pinged Google"

      - name: Ping Bing
        if: steps.verify.outputs.changed == 'true'
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://bigtoolz.com/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://bigtoolz.com/sitemap-blog.xml" || true
          echo "✅ Pinged Bing"
